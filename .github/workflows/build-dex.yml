name: Build Senza Addons dex
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile to classes5.dex
        run: |
          set -e
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          JAR="$(ls -d $SDK/platforms/android-* | sort -V | tail -1)/android.jar"
          BT="$(ls -d $SDK/build-tools/* | sort -V | tail -1)"
          mkdir -p build/stubs build/classes dex
          javac -source 8 -target 8 -bootclasspath "$JAR" -d build/stubs $(find stubs -name '*.java')
          javac -source 8 -target 8 -bootclasspath "$JAR" -cp build/stubs -d build/classes $(find src -name '*.java')
          "$BT/d8" --release --min-api 26 --lib "$JAR" --classpath build/stubs --output dex $(find build/classes -name '*.class')
          mv dex/classes.dex dex/classes5.dex
      - uses: actions/upload-artifact@v4
        with:
          name: classes5-dex
          path: dex/classes5.dex
